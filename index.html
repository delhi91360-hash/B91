<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google! (1998 Retro)</title>
    <style>
        /* 1998 Classic Styling */
        body {
            background-color: #FFFFFF;
            font-family: Arial, Helvetica, sans-serif;
            color: #000000;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        /* Retro 3D Logo Effect */
        .retro-logo {
            font-family: 'Times New Roman', Times, serif;
            font-size: 70px;
            font-weight: bold;
            letter-spacing: -2px;
            margin-top: 40px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0px #cccccc;
        }
        .g1 { color: #2020D0; }
        .o1 { color: #D02020; }
        .o2 { color: #E0A000; }
        .g2 { color: #2020D0; }
        .l  { color: #008000; }
        .e  { color: #D02020; }
        .ex { color: #D02020; font-style: italic; }

        .tagline {
            font-size: 13px;
            margin-bottom: 25px;
        }

        /* Retro Search Box & Buttons */
        .search-box {
            width: 320px;
            font-size: 16px;
            padding: 3px;
            border: 2px inset #CCCCCC;
            background-color: #FFFFFF;
        }

        .btn-container {
            margin-top: 15px;
            margin-bottom: 30px;
        }

        .retro-btn {
            font-family: Arial, sans-serif;
            font-size: 13px;
            background-color: #EFEFEF;
            border: 2px outset #FFFFFF;
            padding: 3px 8px;
            cursor: pointer;
            margin: 0 4px;
        }

        .retro-btn:active {
            border-style: inset;
        }

        /* Retro Links & Special Searches */
        .retro-table {
            margin: 0 auto;
            border-collapse: collapse;
            font-size: 13px;
            background-color: #EEEEEE;
            border: 1px solid #CCCCCC;
            padding: 10px;
            width: 80%;
            max-width: 600px;
        }

        a {
            color: #0000FF;
            text-decoration: underline;
        }

        a:visited {
            color: #551A8B;
        }

        .footer-text {
            font-size: 11px;
            margin-top: 40px;
            color: #555555;
        }

        /* Results Screen Layout */
        #results-screen {
            display: none;
            text-align: left;
            max-width: 800px;
            margin: 0 auto;
        }

        .results-header {
            border-bottom: 1px solid #999999;
            padding-bottom: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .mini-logo {
            font-family: 'Times New Roman', Times, serif;
            font-size: 30px;
            font-weight: bold;
            cursor: pointer;
        }

        .result-item {
            margin-bottom: 20px;
        }

        .result-title {
            font-size: 16px;
            color: #0000FF;
            text-decoration: underline;
            cursor: pointer;
        }

        .result-url {
            font-size: 13px;
            color: #008000;
        }

        .result-snippet {
            font-size: 13px;
            color: #333333;
        }
    </style>
</head>
<body>

    <!-- HOME SCREEN -->
    <div id="home-screen">
        <div class="retro-logo">
            <span class="g1">G</span><span class="o1">o</span><span class="o2">o</span><span class="g2">g</span><span class="l">l</span><span class="e">e</span><span class="ex">!</span>
        </div>
        
        <div class="tagline">Search the web using Google!</div>

        <form id="searchForm" onsubmit="handleSearch(event)">
            <input type="text" id="query" class="search-box" autofocus required>
            <div class="btn-container">
                <button type="submit" class="retro-btn">Google Search</button>
                <button type="button" class="retro-btn" onclick="luckySearch()">I'm Feeling Lucky</button>
            </div>
        </form>

        <table class="retro-table">
            <tr>
                <td>
                    <b>Special Searches:</b><br>
                    <a href="#" onclick="alert('Stanford Search Archive 1998')">Stanford Search</a> | 
                    <a href="#" onclick="alert('Linux Special Search')">Linux Search</a><br><br>
                    <b>Help & Info:</b><br>
                    <a href="#">About Google</a> | <a href="#">Company Info</a> | <a href="#">Google! Logo History</a>
                </td>
            </tr>
        </table>

        <div class="footer-text">
            Copyright ©1998 Google Inc.
        </div>
    </div>

    <!-- SEARCH RESULTS SCREEN -->
    <div id="results-screen">
        <div class="results-header">
            <div class="mini-logo" onclick="showHome()">
                <span class="g1">G</span><span class="o1">o</span><span class="o2">o</span><span class="g2">g</span><span class="l">l</span><span class="e">e</span><span class="ex">!</span>
            </div>
            <input type="text" id="resultQuery" class="search-box" style="width: 250px;">
            <button class="retro-btn" onclick="handleResultSearch()">Search</button>
        </div>

        <div id="resultsContainer"></div>
    </div>

    <script>
        function handleSearch(event) {
            event.preventDefault();
            const q = document.getElementById('query').value;
            if(!q) return;

            // DuckDuckGo HTML Version Redirect for Authentic Retro Feel
            window.location.href = `https://html.duckduckgo.com/html/?q=${encodeURIComponent(q)}`;
        }

        function luckySearch() {
            const q = document.getElementById('query').value;
            if(!q) {
                alert('Please enter a search query first!');
                return;
            }
            // Direct Google Search "I'm Feeling Lucky" Redirect
            window.location.href = `https://www.google.com/search?btnI=1&q=${encodeURIComponent(q)}`;
        }

        function showHome() {
            document.getElementById('home-screen').style.display = 'block';
            document.getElementById('results-screen').style.display = 'none';
        }
    </script>
</body>
</html>
